# Default: single "api" container with embedded SQLite persisted in ./data (WAL mode).
#   docker compose up -d --build
# Optional PostgreSQL: enable the "postgres" profile and point DATABASE_URL at it in backend/.env
#   docker compose --profile postgres up -d --build
#   DATABASE_URL=postgresql+asyncpg://dukandar:${POSTGRES_PASSWORD}@db:5432/dukandar
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: backend/.env
    environment:
      ADMIN_PANEL_DIR: /srv/admin-panel
      # SQLite file inside the mounted ./data volume (override with a postgresql+asyncpg URL in backend/.env for Postgres)
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////srv/backend/data/dukandar.db}
    volumes:
      - ./data:/srv/backend/data
    ports:
      - "127.0.0.1:8000:8000"

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dukandar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dukandar}
      POSTGRES_DB: ${POSTGRES_DB:-dukandar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dukandar} -d ${POSTGRES_DB:-dukandar}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
