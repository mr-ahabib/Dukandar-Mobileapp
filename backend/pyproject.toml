[project]
name = "dukandar-backend"
version = "1.0.0"
description = "Dukandar subscription/licensing backend (FastAPI)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi[standard]>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "SQLAlchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "PyJWT>=2.8",
  "slowapi>=0.1.9",
  "APScheduler>=3.10,<4.0",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 160
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904", "UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
